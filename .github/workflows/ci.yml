name: Adversarial Testing Tool I/O CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-suite-and-validation:
    name: Run All 6 Harnesses & Validate Tool I/O Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node Dependencies
        run: |
          npm ci || npm install
          npm install -g promptfoo@latest

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pydantic pyyaml httpx pytest pytest-asyncio defusedxml

      - name: Execute All 6 Adversarial Testing Harnesses
        run: |
          chmod +x scripts/run_all_harnesses.sh
          ./scripts/run_all_harnesses.sh --parallel --down

      - name: Validate All 22 Tool I/O Fixtures
        run: |
          python scripts/validate_fixtures.py

      - name: Run Unified SDK Tests
        run: |
          python sdk/tests/test_sdk.py

      - name: Archive Tool I/O Example Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841c # v4.6.1
        with:
          name: adversarial-tool-io-examples
          path: |
            examples/
            !examples/**/.gitkeep
          retention-days: 14

  containerized-suite-runner:
    name: Test Containerized Runner (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Containerized Harness Suite
        run: |
          chmod +x scripts/run_containerized.sh scripts/run_all_harnesses.sh
          ./scripts/run_containerized.sh --build

      - name: Validate Output Fixture Files Exist
        run: |
          test -s examples/promptfoo/outputs/promptfoo_results.json
          test -s examples/pyrit/outputs/pyrit_eval_results.json
          test -s examples/garak/outputs/garak_scan.report.jsonl
          test -s examples/rampart/outputs/rampart_results.xml
          test -s examples/inspect_ai/outputs/agent_safety_task.eval
          test -s examples/deepteam/outputs/deepteam_vulnerability_matrix.json

